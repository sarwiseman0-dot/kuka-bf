name: Build APK signé
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer les fichiers
        run: |
          mkdir -p www assets
          cp index.html android.js www/
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Signer
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > kuka.jks
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks kuka.jks --ks-key-alias kuka --ks-pass env:PW --key-pass env:PW --out kuka-music-release.apk aligned.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: KUKA MUSIC signé ${{ github.run_number }}
          files: kuka-music-release.apk
