name: Créer la clé de signature
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Mot de passe de la clé (6 caractères minimum, sans espace)"
        required: true
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - run: |
          keytool -genkeypair -v -keystore kuka.jks -alias kuka -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ inputs.password }}" -keypass "${{ inputs.password }}" -dname "CN=KUKA MUSIC, O=KUKA, C=FR"
          base64 -w0 kuka.jks > keystore-base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cle-kuka-PRIVEE
          path: |
            kuka.jks
            keystore-base64.txt
