name: Build APK debug
on:
  workflow_dispatch:
  push:
    branches: [main, principal]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer les fichiers
        run: |
          mkdir -p www assets
          cp index.html android.js www/
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compiler l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk kuka-music-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kuka-music-debug-apk
          path: kuka-music-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: KUKA MUSIC debug ${{ github.run_number }}
          files: kuka-music-debug.apk
